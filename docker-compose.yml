# Ticket Triage System Under Test: service + Ollama (CPU only).
# No GPU devices are passed through, so Ollama runs on CPU as the client requires.
services:
  ollama:
    # Pinned to the version running on the confirmed benchmark host (AMD Ryzen 7 7745HX, CPU-only
    # confirmed 2026-10-02). Reported with the test environment on Slide 7.
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.35.0}
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      # BASELINE: Ollama processes exactly ONE request at a time. Concurrent requests
      # wait in Ollama's internal queue. Fixed at 1 on purpose; do not change for Assignment 1.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: "-1"         # keep the model in memory; no reload between requests
      OLLAMA_MAX_QUEUE: "512"         # Ollama's default; requests beyond this are rejected (HTTP 503)
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  service:
    build: ./service
    container_name: triage-service
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      # A2 configuration, all from .env so no code change is needed between runs:
      #   MODE=single  + MODEL=<tag>
      #   MODE=cascade + SMALL_MODEL=<tag> LARGE_MODEL=<tag> CASCADE_SETTING=1|2
      MODE: ${MODE:-single}
      MODEL: ${MODEL:-}               # single mode: the candidate under test
      SMALL_MODEL: ${SMALL_MODEL:-}   # cascade: classifies first
      LARGE_MODEL: ${LARGE_MODEL:-}   # cascade: answers escalated tickets, final
      CASCADE_SETTING: ${CASCADE_SETTING:-}
      CONFIG_LABEL: ${CONFIG_LABEL:-} # fixed label returned to the caller; defaults per mode
      NUM_CTX: ${NUM_CTX:-2048}
      DB_PATH: /data/tickets.db
      LOG_DIR: /logs
    volumes:
      - ./logs:/logs                  # request logs, kept in the repo
      - triage_db:/data               # SQLite database
    restart: unless-stopped

volumes:
  ollama_models:
  triage_db:
